<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Admin Login
    </title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


    <div class="login-box">


        <h1>
            Admin Login
        </h1>


        <p>
            School Supply Availability Checker
        </p>



        {% if error %}

        <div class="error">

            {{ error }}

        </div>

        {% endif %}



        <form method="POST">


            <label>
                Username
            </label>


            <input type="text" name="username" required>



            <label>
                Password
            </label>


            <input type="password" name="password" required>



            <button type="submit">

                Login

            </button>


        </form>



        <br>


        <a href="{{ url_for('home') }}">

            Back to Public Checker

        </a>


    </div>


</body>

</html>
